<!DOCTYPE html>
<html lang="az"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dieta Planım</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7f2;--card:#fff;--tx:#1f2a1f;--mu:#6b786b;--ac:#2f8f4e;--ln:#e1e8de;--ac2:#e8f5ec;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141914;--card:#1e251e;--tx:#e8efe8;--mu:#9aa79a;--ac:#4cc374;--ln:#2d372d;--ac2:#1f3326;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141914;--card:#1e251e;--tx:#e8efe8;--mu:#9aa79a;--ac:#4cc374;--ln:#2d372d;--ac2:#1f3326;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:80px}
.w{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:4px 0}
.nav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:8px 12px;border:1px solid var(--ln)}
.nav button{background:none;border:0;font-size:26px;color:var(--ac);padding:4px 12px}
.nav div{text-align:center}.nav b{font-size:17px}.nav small{color:var(--mu);display:block}
.bar{height:10px;background:var(--ln);border-radius:9px;margin:12px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.pc{font-size:13px;color:var(--mu);text-align:right;margin-top:-6px}
.sec{background:var(--card);border:1px solid var(--ln);border-radius:14px;margin:12px 0;overflow:hidden}
.sec h2{margin:0;padding:10px 14px;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--ac);background:var(--ac2)}
.it{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--ln);cursor:pointer}
.it:first-of-type{border-top:0}
.ck{flex:0 0 26px;height:26px;border:2px solid var(--ac);border-radius:8px;display:grid;place-items:center;color:#fff;font-size:16px;margin-top:1px}
.it.on .ck{background:var(--ac)}.it.on .ck:after{content:"✓"}
.it.on .t{text-decoration:line-through;color:var(--mu)}
.t{flex:1}.t small{display:block;color:var(--mu);font-size:13px}
.med .ck{border-color:#d9772b}.med.on .ck{background:#d9772b}
.cnt{display:flex;gap:8px;padding:12px 14px;align-items:center;flex-wrap:wrap}
.cnt button.g{width:38px;height:38px;border-radius:50%;border:2px solid var(--ac);background:none;color:var(--ac);font-size:18px}
.cnt button.g.on{background:var(--ac);color:#fff}
input[type=number],input[type=text],input[type=date]{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);width:100%}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;border:0;padding:10px 2px;font:inherit;font-size:12px;color:var(--mu)}
.tabs button span{display:block;font-size:21px}.tabs button.on{color:var(--ac);font-weight:600}
.pill{display:inline-block;padding:6px 12px;border-radius:20px;border:1px solid var(--ac);color:var(--ac);margin:4px 4px 0 0;font-size:14px;background:none}
.pill.on{background:var(--ac);color:#fff}
.pd{padding:12px 14px;border-top:1px solid var(--ln)}.pd b{color:var(--ac)}
.note{font-size:13px;color:var(--mu);padding:10px 14px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.rst{margin-top:14px;padding:10px;border:1px solid var(--ln);border-radius:10px;background:none;color:var(--mu);font:inherit;width:100%}
</style></head><body><div class="w" id="app"></div>
<div class="tabs" id="tabs"></div>
<script>
var D=[
{b:"2 soyutma yumurta + salat (5–6 zeytun, 5–6 badam, xiyar, bibər, şüyüd, 1 x.q zeytun yağı, limon) + 1 dilim qlutensiz çörək",
 l:"200 qr toyuq əti + 3–4 x.q qreçka + 1 ovuc kələm turşusu",
 d:"4 x.q toyuqlu göbələk sote (zeytun yağında soğan, pomidor, bibərlə)"},
{b:"3 x.q yulaf (laktozsuz südlə) + ½ banan + 5–6 çiyələk + 2 qoz + toz darçın",
 l:"2 sobada bişmiş kotlet + 1 dilim qlutensiz çörək + çoban salatı",
 d:"Soyuq dovğa (1 kasa qatıq, şüyüd, 1 xiyar, 3 x.q noxud, nanə quru)"},
{b:"2 yumurta ilə küküdür (1 x.q zeytun yağında, zirinc) + salat (5–6 zeytun, xiyar, zirinc, bibər, zeytun yağı, limon, 1 x.q balqabaq tumu) + 1 dilim qlutensiz çörək",
 l:"Balıq tavada yağsız 200 qr + 4 x.q manqal salatı + göyərti",
 d:"4 x.q yaşıl lobya (1 x.q zeytun yağında, soğan, pomidor, bibərlə) + çoban salatı"},
{b:"2 soyutma yumurta (sumax) + salat (5–6 zeytun, 1 x.q balqabaq tumu, xiyar, cəfəri, şüyüd, 1 x.q zeytun yağı, limon) + 1–2 dilim qlutensiz çörək",
 l:"Quzu əti sobada / kabab 200 qr + 1 sobada bişmiş kartof + bol yaşıllıqlı tərəvəz salatı (üzərinə limon)",
 d:"Soyuq dovğa (1 kasa qatıq, şüyüd, 1 xiyar, 3 x.q noxud, nanə quru)"},
{b:"1 soyutma yumurta + 1 dilim keçi pendiri (olmazsa inək) + xiyar, bibər, cəfəri, şüyüd, 6–7 keşyu, zeytun yağı, limon, zirinc",
 l:"1 çömçə mərcimək şorbası + qarışıq tərəvəzlərlə toyuq salatı",
 d:"Ton balığı salatı (qarışıq tərəvəzlərlə 80 qr ton balığı)"},
{b:"3 x.q yulaf (laktozsuz südlə) + ½ banan + 5–6 çiyələk + 2 qoz + toz darçın",
 l:"200 qr çolpa sobada + çoban salatı + 3 x.q qreçka",
 d:"Brokkoli ilə omlet (xırda doğrayıb, yumurta əlavə edin) + çoban salatı"},
{b:"2 yumurta ilə pomidor-yumurta + 1 dilim pendir + salat (bibər, zirinc, xiyar, cəfəri, şüyüd, 1 x.q zeytun yağı, limon) + 1–2 dilim qlutensiz çörək",
 l:"Sobada bişmiş balıq 200 qr + 100 qr sobada bişmiş tərəvəzlər (brokkoli, gül kələmi, bibər, kök)",
 d:"Qarışıq tərəvəzlərlə toyuq salatı (100 qr toyuq fileyi ilə)"}];
var SH=[
{n:"Alış-veriş 1 · Gün 1–2",g:[
["🥚 Zülal","Yumurta (4)|Toyuq əti 200 qr|Toyuq fileyi + göbələk (sote üçün)|Kotlet üçün ət (2 ədəd)|Qatıq (1 kasa)"],
["🥬 Tərəvəz","Xiyar (4)|Bibər (3)|Pomidor (3)|Soğan|Şüyüd, cəfəri|Limon (2)|Kələm turşusu"],
["🥣 Qalan","Zeytun, badam|Qlutensiz çörək (mərcimək/qarabaşaq/kinoa unundan)|Yulaf + laktozsuz süd|Banan, çiyələk, qoz, toz darçın|Qreçka|Noxud, quru nanə|Zeytun yağı, çörəkotu yağı, alma sirkəsi|Meyvə (2 pors)|Yaşıl çay / bitki çayları"]]},
{n:"Alış-veriş 2 · Gün 3–4",g:[
["🥚 Zülal","Yumurta (4)|Balıq 200 qr|Quzu əti 200 qr (kabab)|Qatıq (1 kasa)"],
["🥬 Tərəvəz","Kartof (1)|Yaşıl lobya (~200 qr)|Manqal salatı üçün: badımcan, pomidor, bibər|Xiyar (5), bibər (3), pomidor (3)|Soğan, zirinc|Cəfəri, şüyüd, göyərti|Limon (3)"],
["🥣 Qalan","Zeytun|Balqabaq tumu|Sumax|Qlutensiz çörək|Noxud, quru nanə|Zeytun yağı|Meyvə (2 pors)"]]},
{n:"Alış-veriş 3 · Gün 5–7",g:[
["🥚 Zülal","Yumurta (5)|Toyuq əti / fileyi (~250 qr)|Ton balığı (80 qr)|Çolpa 200 qr|Balıq 200 qr|Keçi pendiri + pendir|Mərcimək|Keşyu"],
["🥬 Tərəvəz","Brokkoli (2)|Gül kələmi|Kök, bibər (4)|Xiyar (5), pomidor (5)|Cəfəri, şüyüd, zirinc|Limon (3)|Qarışıq salat tərəvəzləri"],
["🥣 Qalan","Yulaf, laktozsuz süd, banan, çiyələk, qoz, toz darçın|Qreçka|Qlutensiz çörək|Zeytun yağı|Meyvə (3 pors)"]]}];
var MED=[["m1","Dərman 1","səhər yeməyi vaxtı"],["m2","Dərman 2","günorta yeməyi vaxtı"],["m3","Dərman 3","axşam yeməkdən əvvəl"],["m4","Dərman 4","axşam yemək vaxtı"],["m5","Dərman 5","axşam yeməkdən sonra"]];
var S,tab="today",cur=new Date();
try{S=JSON.parse(localStorage.getItem("dieta")||"null")}catch(e){}
S=S||{};S.done=S.done||{};S.shop=S.shop||{};S.meds=S.meds||{};S.water=S.water||{};S.steps=S.steps||{};
if(!S.start){S.start=iso(new Date())}
function save(){try{localStorage.setItem("dieta",JSON.stringify(S))}catch(e){}}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function dayNo(d){var a=new Date(S.start+"T00:00:00"),b=new Date(iso(d)+"T00:00:00");var n=Math.round((b-a)/864e5);return((n%7)+7)%7}
var AZ=["Bazar","Bazar ertəsi","Çərşənbə axşamı","Çərşənbə","Cümə axşamı","Cümə","Şənbə"];
var MO=["yanvar","fevral","mart","aprel","may","iyun","iyul","avqust","sentyabr","oktyabr","noyabr","dekabr"];
function items(k){var p=D[dayNo(cur)];var md=function(i){var n=S.meds[MED[i][0]];return{k:MED[i][0],t:"💊 "+MED[i][1]+(n?" — "+esc(n):""),s:MED[i][2],c:"med"}};
return[
["🌅 Səhər",[{k:"wake",t:"1 stəkan su",s:"yuxudan duran kimi"},{k:"b",t:esc(p.b),s:"Səhər yeməyi · 11:00"},md(0),{k:"tea1",t:"Yaşıl çay / bitki çayı",s:"arada"}]],
["☀️ Günorta",[{k:"vin",t:"1 x.q ev üsulu alma sirkəsi",s:"yeməkdən əvvəl · 15:00"},{k:"l",t:esc(p.l),s:"Günorta yeməyi · 15:00 · salatlara 1 ç.q çörəkotu yağı"},md(1),{k:"fr",t:"1 pors meyvə",s:"günorta yeməkdən sonra"}]],
["🌙 Axşam",[md(2),{k:"d",t:esc(p.d),s:"Axşam yeməyi · 19:00"},md(3),md(4),{k:"tea2",t:"1 st bitki çayı (nanə, jasmin, melisa, ihlamur, çobanyastığı, zəfəran)",s:"arada · 21:00"}]]]}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function render(){var h="";
if(tab=="today"){var key=iso(cur),dn=dayNo(cur),st=S.done[key]=S.done[key]||{},tot=0,dn2=0;
var L=items();L.forEach(function(s){s[1].forEach(function(i){tot++;if(st[i.k])dn2++})});
var extra=["walk","goal"];extra.forEach(function(k){tot++;if(st[k])dn2++});tot++;if((S.water[key]||0)>=7)dn2++;
var pc=Math.round(dn2/tot*100);
h+='<div class="nav"><button data-a="prev">‹</button><div><b>Gün '+(dn+1)+' · '+AZ[cur.getDay()]+'</b><small>'+cur.getDate()+' '+MO[cur.getMonth()]+' '+cur.getFullYear()+'</small></div><button data-a="next">›</button></div>';
h+='<div class="bar"><i style="width:'+pc+'%"></i></div><div class="pc">'+dn2+' / '+tot+' · '+pc+'%</div>';
L.forEach(function(s){h+='<div class="sec"><h2>'+s[0]+'</h2>';s[1].forEach(function(i){h+='<div class="it '+(i.c||"")+(st[i.k]?" on":"")+'" data-k="'+i.k+'"><div class="ck"></div><div class="t">'+i.t+'<small>'+i.s+'</small></div></div>'});h+='</div>'});
var w=S.water[key]||0;
h+='<div class="sec"><h2>🏃 Gün ərzində</h2><div class="cnt"><b>💧 Su (1,5–2 L):</b>';
for(var i=1;i<=8;i++)h+='<button class="g '+(w>=i?"on":"")+'" data-w="'+i+'">'+i+'</button>';
h+='<span style="color:var(--mu);font-size:13px;width:100%">1 düymə ≈ 250 ml · yenidən basanda geri alınır</span></div>';
[["walk","Yürüyüş 1 saat",""],["goal","Addım hədəfini keçdim 🎯","həkimə atılacaq addım sayı"]].forEach(function(i){h+='<div class="it'+(st[i[0]]?" on":"")+'" data-k="'+i[0]+'"><div class="ck"></div><div class="t">'+i[1]+(i[2]?'<small>'+i[2]+'</small>':'')+'</div></div>'});
h+='<div class="pd"><label style="margin-top:0">Bu günkü addım sayı</label><input type="number" inputmode="numeric" id="stp" placeholder="məs. 8500" value="'+(S.steps[key]||"")+'"></div>';
h+='<div class="note">😴 Yuxu: 7,5–9 saat · 🍵 Bitki çayı: gündə 2 st (sərbəst)</div></div>';
}
if(tab=="shop"){h+='<h1>🛒 Alış-veriş siyahısı</h1><div class="note" style="padding:0 0 6px">Həftədə 3 dəfə: gün 1 başlamazdan əvvəl (məs. bazar), sonra 2 dəfə də. Aldıqca işarələ.</div>';
SH.forEach(function(s,si){h+='<div class="sec"><h2>'+s.n+'</h2>';s.g.forEach(function(g,gi){h+='<div class="pd" style="padding:8px 14px;color:var(--mu);font-size:13px"><b>'+g[0]+'</b></div>';g[1].split("|").forEach(function(x,xi){var k="s"+si+"_"+gi+"_"+xi;h+='<div class="it'+(S.shop[k]?" on":"")+'" data-s="'+k+'" style="padding:9px 14px"><div class="ck"></div><div class="t">'+x+'</div></div>'})});h+='</div>'});
h+='<button class="rst" data-a="rs">Siyahını sıfırla</button>'}
if(tab=="plan"){h+='<h1>📋 7 günlük plan</h1><div class="note" style="padding:0 0 6px">Qlutensiz çörək: mərcimək / qarabaşaq / kinoa unundan hazırlana bilər.</div>';
D.forEach(function(p,i){h+='<div class="sec"><h2>Gün '+(i+1)+'</h2><div class="pd"><b>Səhər 11:00</b><br>'+esc(p.b)+'</div><div class="pd"><b>Günorta 15:00</b><br>'+esc(p.l)+'</div><div class="pd"><b>Axşam 19:00</b><br>'+esc(p.d)+'</div></div>'})}
if(tab=="set"){h+='<h1>⚙️ Ayarlar</h1><div class="sec"><h2>Dieta başlanğıcı</h2><div class="pd"><label style="margin-top:0">Gün 1 hansı tarixdir?</label><input type="date" id="sd" value="'+S.start+'"></div></div>';
h+='<div class="sec"><h2>Dərmanlar</h2><div class="pd" style="color:var(--mu);font-size:13px">Adını yaz (istəsən), siyahıda görünəcək.</div>';
MED.forEach(function(m){h+='<div class="pd"><label style="margin-top:0">'+m[1]+' · '+m[2]+'</label><input type="text" data-m="'+m[0]+'" value="'+esc(S.meds[m[0]]||"")+'" placeholder="dərmanın adı / dozası"></div>'});h+='</div>'}
document.getElementById("app").innerHTML=h;
var T=[["today","📅","Bu gün"],["shop","🛒","Alış-veriş"],["plan","📋","Plan"],["set","⚙️","Ayarlar"]];
document.getElementById("tabs").innerHTML=T.map(function(t){return'<button data-t="'+t[0]+'" class="'+(tab==t[0]?"on":"")+'"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("")}
document.addEventListener("click",function(e){var el=e.target.closest("[data-k],[data-s],[data-w],[data-a],[data-t]");if(!el)return;var key=iso(cur),y=window.scrollY;
if(el.dataset.t){tab=el.dataset.t;render();window.scrollTo(0,0);return}
if(el.dataset.k){var st=S.done[key]=S.done[key]||{};st[el.dataset.k]=!st[el.dataset.k]}
else if(el.dataset.s){S.shop[el.dataset.s]=!S.shop[el.dataset.s]}
else if(el.dataset.w){var n=+el.dataset.w;S.water[key]=(S.water[key]==n)?n-1:n}
else if(el.dataset.a=="prev"){cur.setDate(cur.getDate()-1)}
else if(el.dataset.a=="next"){cur.setDate(cur.getDate()+1)}
else if(el.dataset.a=="rs"){S.shop={}}
save();render();if(!el.dataset.a||el.dataset.a=="rs")window.scrollTo(0,y)});
document.addEventListener("input",function(e){var t=e.target;
if(t.id=="stp"){S.steps[iso(cur)]=t.value}
else if(t.id=="sd"&&t.value){S.start=t.value}
else if(t.dataset.m){S.meds[t.dataset.m]=t.value}
save()});
render();
</script></body></html>
